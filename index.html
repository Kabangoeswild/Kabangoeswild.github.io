<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>AR Marker Image Switcher</title>
  <script src="aframe.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .arrow-controls {
      position: absolute;
      z-index: 10;
      display: flex;
      gap: 20px;
      font-size: 48px;
      cursor: pointer;
      user-select: none;
    }

    .up-down {
      top: 20%;
      right: 20px;
      flex-direction: column;
    }

    .left-right {
      bottom: 20px;
      left: 20px;
      flex-direction: row;
    }

    .arrow {
      padding: 20px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <a-scene embedded arjs="sourceType: webcam; trackingMethod: best;" renderer="alpha: true">
    <a-assets>
      <img id="image1" src="CPTsection.jpg" crossorigin="anonymous" />
      <img id="image2" src="ShieldWeld.jpg" crossorigin="anonymous" />
      <img id="image3" src="Section1New.png" crossorigin="anonymous" />
      <img id="image4" src="Section2New.png" crossorigin="anonymous" />
      <img id="image5" src="Section3New.png" crossorigin="anonymous" />
      <img id="image6" src="Section4New.png" crossorigin="anonymous" />
      <img id="image7" src="Section5New.png" crossorigin="anonymous" />
    </a-assets>

    <a-marker type="pattern" patternUrl="pattern-dlr_logo2jpg.patt" changeMatrixMode="modelViewMatrix">
      <!-- Bildgruppe 1 & 2 -->
      <a-image id="markerImage1" src="#image1" width="5" height="3" position="0 -1 -1.5" rotation="-90 0 90" visible="true"></a-image>
      <a-image id="markerImage2" src="#image2" width="5" height="3" position="0 -1 -1.5" rotation="-90 0 90" visible="false"></a-image>

      <!-- Bildgruppe 3–7 -->
      <a-image id="markerImage3" src="#image3" width="5" height="5" position="1.8 -1 -1.5" rotation="0 90 0" visible="true"></a-image>
      <a-image id="markerImage4" src="#image4" width="5" height="5" position="1.6 -1 -1.5" rotation="0 90 0" visible="false"></a-image>
      <a-image id="markerImage5" src="#image5" width="5" height="5" position="1.4 -1 -1.5" rotation="0 90 0" visible="false"></a-image>
      <a-image id="markerImage6" src="#image6" width="5" height="5" position="1.2 -1 -1.5" rotation="0 90 0" visible="false"></a-image>
      <a-image id="markerImage7" src="#image7" width="5" height="5" position="1 -1 -1.5" rotation="0 90 0" visible="false"></a-image>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Steuerung für Bild 1 & 2 (oben rechts ↑ ↓) -->
  <div class="arrow-controls up-down">
    <div class="arrow" onclick="showMainImage(1)">↑</div>
    <div class="arrow" onclick="showMainImage(2)">↓</div>
  </div>

  <!-- Steuerung für Bilder 3–7 (unten links ← →) -->
  <div class="arrow-controls left-right">
    <div class="arrow" onclick="prevSectionImage()">←</div>
    <div class="arrow" onclick="nextSectionImage()">→</div>
  </div>

  <script>
    let currentSectionIndex = 3; // Startbild der unteren Gruppe

    function showMainImage(index) {
      console.log("Hauptbild anzeigen: Bild " + index);
      for (let i = 1; i <= 2; i++) {
        const image = document.getElementById(`markerImage${i}`);
        image.setAttribute('visible', i === index);
      }
    }

    function showSectionImage(index) {
      console.log("Sektion anzeigen: Bild " + index);
      for (let i = 3; i <= 7; i++) {
        const image = document.getElementById(`markerImage${i}`);
        image.setAttribute('visible', i === index);
      }
    }

    function nextSectionImage() {
      currentSectionIndex++;
      if (currentSectionIndex > 7) currentSectionIndex = 3;
      showSectionImage(currentSectionIndex);
    }

    function prevSectionImage() {
      currentSectionIndex--;
      if (currentSectionIndex < 3) currentSectionIndex = 7;
      showSectionImage(currentSectionIndex);
    }
  </script>
</body>
</html>
